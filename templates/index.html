<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFRO Chatbot - Asistente de Normativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: 70vh;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            background-color: #f8f9fa;
        }
        
        .message {
            margin-bottom: 1rem;
        }
        
        .user-message {
            text-align: right;
        }
        
        .user-message .badge {
            background-color: #0d6efd;
        }
        
        .bot-message .badge {
            background-color: #198754;
        }
        
        .source-card {
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
        
        .metrics {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }
        
        .loading {
            display: none;
        }
        
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-robot me-2"></i>
                            UFRO Chatbot - Asistente de Normativa Universitaria
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Chat Container -->
                        <div id="chatContainer" class="chat-container mb-3">
                            <div class="text-center text-muted">
                                <i class="fas fa-comments fa-3x mb-3"></i>
                                <p>¡Hola! Soy tu asistente para consultas sobre normativa UFRO.<br>
                                Puedes preguntarme sobre reglamentos, procedimientos, calendarios académicos y más.</p>
                            </div>
                        </div>
                        
                        <!-- Loading indicator -->
                        <div id="loading" class="loading text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Procesando...</span>
                            </div>
                            <p class="mt-2">Buscando en la normativa UFRO...</p>
                        </div>
                        
                        <!-- Input Form -->
                        <form id="chatForm">
                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <select id="provider" class="form-select">
                                        <option value="">Cualquier proveedor</option>
                                        <option value="deepseek">DeepSeek</option>
                                        <option value="chatgpt">ChatGPT</option>
                                    </select>
                                </div>
                                <div class="col-md-2 mb-2">
                                    <input type="number" id="k" class="form-control" value="5" min="1" max="10" 
                                           title="Número de documentos a consultar">
                                </div>
                                <div class="col-md-4 mb-2">
                                    <button type="button" class="btn btn-outline-secondary btn-sm" 
                                            onclick="clearChat()">
                                        <i class="fas fa-trash"></i> Limpiar
                                    </button>
                                </div>
                            </div>
                            <div class="input-group">
                                <input type="text" id="messageInput" class="form-control" 
                                       placeholder="Escribe tu pregunta sobre normativa UFRO..." 
                                       required>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-paper-plane"></i> Enviar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const loading = document.getElementById('loading');
        
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;
            
            const provider = document.getElementById('provider').value;
            const k = parseInt(document.getElementById('k').value);
            
            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            
            // Show loading
            loading.classList.add('show');
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        provider: provider || null,
                        k: k
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addBotMessage(data.result);
                } else {
                    addMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addMessage(`Error de conexión: ${error.message}`, 'error');
            } finally {
                loading.classList.remove('show');
            }
        });
        
        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            
            if (type === 'user') {
                messageDiv.innerHTML = `
                    <span class="badge bg-primary">Tú</span>
                    <div class="mt-2">${escapeHtml(content)}</div>
                `;
            } else if (type === 'error') {
                messageDiv.innerHTML = `
                    <span class="badge bg-danger">Error</span>
                    <div class="mt-2 text-danger">${escapeHtml(content)}</div>
                `;
            }
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function addBotMessage(result) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            
            let sourcesHtml = '';
            if (result.sources && result.sources.length > 0) {
                sourcesHtml = '<div class="mt-3"><strong>Fuentes consultadas:</strong>';
                result.sources.forEach((source, index) => {
                    sourcesHtml += `
                        <div class="source-card card mt-2">
                            <div class="card-body py-2">
                                <h6 class="card-title mb-1">${escapeHtml(source.title)}</h6>
                                <p class="card-text mb-1">${escapeHtml(source.content)}</p>
                                <small class="text-muted">Página ${source.page} - Score: ${source.score.toFixed(3)}</small>
                            </div>
                        </div>
                    `;
                });
                sourcesHtml += '</div>';
            }
            
            let metricsHtml = '';
            if (result.metrics) {
                metricsHtml = `
                    <div class="metrics">
                        <i class="fas fa-chart-bar"></i>
                        Tokens: ${result.metrics.tokens} | 
                        Latencia: ${result.metrics.latency}s | 
                        Costo: $${result.metrics.cost} | 
                        Proveedor: ${result.provider}
                    </div>
                `;
            }
            
            messageDiv.innerHTML = `
                <span class="badge bg-success">UFRO Assistant</span>
                <div class="mt-2">${formatAnswer(result.answer)}</div>
                ${sourcesHtml}
                ${metricsHtml}
            `;
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function formatAnswer(answer) {
            // Simple formatting for better readability
            return escapeHtml(answer)
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/^/, '<p>')
                .replace(/$/, '</p>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function clearChat() {
            chatContainer.innerHTML = `
                <div class="text-center text-muted">
                    <i class="fas fa-comments fa-3x mb-3"></i>
                    <p>¡Hola! Soy tu asistente para consultas sobre normativa UFRO.<br>
                    Puedes preguntarme sobre reglamentos, procedimientos, calendarios académicos y más.</p>
                </div>
            `;
        }
        
        // Focus on input when page loads
        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
</body>
</html>
